# 牛牛便利贴 wiki（规范：test-wiki/main-wiki/docs/new-subservice.md）
# deploy.sh 把 docs/ 构建到 site/，npm run build:docs 再把 site/（不含 .md）放进 build/dist/wiki/ 上线。
# site_url 是本服务对外的地址：路径 /wiki/ 要和 server/wiki.ts、edgeone.json 一致；主 wiki 的 build_main.py 从这里读地址来取数。
# 页面和接口同源，所以不配 api_base：live.js 没有 <meta name="api-base"> 时请求当前站点（自带登录 cookie）。
# 给 AI 的 /wiki/<页>.md 由边缘函数渲染（src/server/wiki.ts）。
# 加一页要同步三处：下面的 nav、src/server/wiki.ts 的 PAGES、edgeone.json 的 301。

[project]
site_name = "牛牛便利贴"
site_description = "这台设备粘贴，那台设备拿走：项目文档和给 AI 的读写接口说明（含实时数据）"
site_url = "https://clip.liuhetian.life/wiki/"
use_directory_urls = true
extra_javascript = ["javascripts/live.js"]

nav = [
  { "牛牛便利贴" = "index.md" },
  { "需求" = "requirements.md" },
  { "给 AI 的接口说明" = "ai-api.md" },
  { "部署与日常维护" = "ops.md" },
  { "开发" = "dev.md" },
  { "时间线" = "timeline.md" },
  { "待办" = "todo.md" },
]

[project.theme]
language = "zh"
# 不从 Google Fonts 拉字体（大陆访问不了），用系统字体
font = false
features = [
  "navigation.sections",
  "navigation.instant",
  "navigation.footer",
  "content.code.copy",
  "search.highlight",
]

# 不要启用 macros 插件（会在构建时吃掉 {{ }}），也不要启用 smarty（会把 " 改成弯引号）
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
